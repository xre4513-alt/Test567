name: Signup Test
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Kitni baar chalana hai (max 5)"
        default: "1"
      debug:
        description: "Debug mode (1 = sirf page ke fields print karo)"
        default: "0"
      success_text:
        description: "Signup ke baad page par dikhne wala text (optional)"
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run signup test
        run: python signup_test.py
        env:
          TEST_URL: ${{ secrets.TEST_URL }}
          RUNS: ${{ github.event.inputs.runs }}
          DEBUG_MODE: ${{ github.event.inputs.debug }}
          SUCCESS_TEXT: ${{ github.event.inputs.success_text }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: "*.png"
